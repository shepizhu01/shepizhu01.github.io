<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230a0a0f'/><text x='50' y='60' font-size='50' fill='%23ace' text-anchor='middle'>玄</text></svg>">
<title>玄荒秘境｜PWA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0f;font-family:system-ui, sans-serif;color:#fff;}
#gameCanvas{display:block;background:#11141a;}
.ui{position:absolute;left:0;width:100%;padding:10px;}
.top{top:0;display:flex;justify-content:space-between;align-items:center;font-size:14px;background:rgba(0,0,0,0.5);gap:4px;flex-wrap:wrap;}
.bottom{bottom:0;display:flex;gap:6px;justify-content:center;padding-bottom:24px;background:linear-gradient(transparent,#000 70%);}
.btn{width:66px;height:66px;border-radius:50%;border:1px solid #778;color:#fff;background:rgba(30,60,80,0.7);font-size:12px;}
.btn:disabled{opacity:0.4}
.panel{position:absolute;inset:0;background:rgba(0,0,0,0.88);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center;overflow-y:auto;z-index:97;}
.shopPanel{position:absolute;inset:10px;background:rgba(0,0,0,0.94);border-radius:12px;padding:14px;display:none;overflow-y:auto;z-index:99;}
.cheatPanel{position:absolute;top:60px;left:8px;width:240px;background:rgba(0,0,0,0.92);border:1px solid #568;border-radius:10px;padding:12px;display:none;font-size:13px;z-index:100;}
.bagPanel{position:absolute;inset:10px;background:rgba(0,0,0,0.94);border-radius:12px;padding:14px;display:none;overflow-y:auto;z-index:98;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0;}
.item{width:52px;height:52px;border:1px solid #446;border-radius:6px;background:#151a26;display:flex;align-items:center;justify-content:center;font-size:11px;}
.item.rare{border-color:#84c}
.item.legend{border-color:#fc3}
.item.artifact{border-color:#f0f}
.hpBar{width:110px;height:10px;background:#333;border-radius:4px;overflow:hidden;}
.hpFill{height:100%;background:#c44;transition:0.15s;}
.expBar{width:110px;height:6px;background:#222;border-radius:3px;margin-top:3px;overflow:hidden;}
.expFill{height:100%;background:#4a8;}
.tip{font-size:12px;color:#aaa;margin-top:4px;}
input{width:100%;background:#1a2230;color:#fff;border:1px solid #446;border-radius:4px;padding:4px;margin:4px 0;}
.cheatBtn{padding:6px;margin:3px;border-radius:5px;background:#224;color:#fff;border:1px solid #468;}
.buyBtn{padding:6px 8px;margin:4px;border-radius:5px;background:#144;color:#fff;border:1px solid #388;}
.closeBtn{position:absolute;top:8px;right:10px;padding:4px 8px;background:#333;border-radius:4px;}
.titleTxt{font-size:17px;margin-bottom:8px;color:#ace;}
.descTxt{font-size:12px;color:#bbb;line-height:1.4;}
.shopItem{padding:8px;border:1px solid #357;border-radius:8px;margin:6px 0;text-align:left;}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div class="ui top">
  <div>境界：<span id="jingjie">炼气初期</span></div>
  <div>灵石：<span id="coin">0</span></div>
  <div class="hpBar"><div id="hpFill" class="hpFill"></div></div>
  <div class="expBar"><div id="expFill" class="expFill"></div></div>
  <button class="cheatBtn" id="cheatOpen">作弊</button>
  <button class="cheatBtn" id="bagOpen">背包</button>
  <button class="cheatBtn" id="shopOpen" style="display:none">商人</button>
</div>
<div class="ui bottom">
  <button class="btn" id="skill1">武技<br>万剑</button>
  <button class="btn" id="skill2">绝技<br>雷爆</button>
  <button class="btn" id="skill3">身法<br>遁影</button>
  <button class="btn" id="useDan">丹药</button>
</div>

<div class="panel" id="selectPanel">
  <h3 id="panelTitle">秘境奇遇</h3>
  <div id="opts"></div>
  <div class="tip" style="margin-top:12px"></div>
  <button class="closeBtn" onclick="selectPanel.style.display='none'">✕</button>
</div>

<div class="shopPanel" id="shopPanel">
  <div class="titleTxt">🧙 秘境商人</div>
  <div id="shopList"></div>
  <button class="closeBtn" onclick="shopPanel.style.display='none'">✕</button>
</div>

<div class="cheatPanel" id="cheatPanel">
  <div class="titleTxt">⚙ 作弊控制台</div>
  <label>当前血量</label><input type="number" id="cHp">
  <label>最大血量</label><input type="number" id="cMaxHp">
  <label>修为</label><input type="number" id="cExp">
  <label>境界索引(0~8)</label><input type="number" id="cJing">
  <label>灵石</label><input type="number" id="cCoin">
  <div style="margin:8px 0;">
    <button class="cheatBtn" onclick="applyCheat()">确认修改</button>
    <button class="cheatBtn" onclick="giveRandomEquip()">获取装备</button>
    <button class="cheatBtn" onclick="giveArtifact()">获得神器</button>
    <button class="cheatBtn" onclick="giveAllDan()">补满丹药</button>
  </div>
  <button class="closeBtn" onclick="cheatPanel.style.display='none'">✕</button>
</div>

<div class="bagPanel" id="bagPanel">
  <div class="titleTxt">📦 背包 & 装备</div>
  <div style="display:flex;gap:10px;">
    <div>
      <div>武器</div><div class="item" id="slotWep"></div>
      <div>法袍</div><div class="item" id="slotArmor"></div>
      <div>饰品</div><div class="item" id="slotTrinket"></div>
    </div>
    <div style="flex:1;">
      <div>物品栏</div>
      <div class="grid" id="bagGrid"></div>
    </div>
  </div>
  <div class="descTxt" id="itemDesc"></div>
  <button class="closeBtn" onclick="bagPanel.style.display='none'">✕</button>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js', {scope: './'});
}
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

const jings = ["炼气初期","炼气中期","炼气后期","筑基初期","筑基中期","筑基后期","结丹初期","结丹中期","结丹后期"];
const modPool = [
  {name:"剑势增伤",desc:"武技伤害+22%",type:"atk",v:0.22},
  {name:"雷劫淬体",desc:"最大生命+30%",type:"hp",v:0.30},
  {name:"速通",desc:"武技冷却-18%",type:"cd1",v:0.18},
  {name:"灵影",desc:"身法冷却-25%",type:"cd3",v:0.25},
  {name:"聚灵",desc:"修为获取+35%",type:"exp",v:0.35},
  {name:"剑雨",desc:"武技弹道+1",type:"bullet",v:1},
  {name:"厚土道体",desc:"受到伤害-15%",type:"def",v:0.15},
  {name:"惊雷引",desc:"绝技范围+30%",type:"range",v:0.30},
];
const equipPool = [
  {name:"青锋剑",slot:"wep",atk:8,rarity:"normal",price:30},
  {name:"玄雷剑",slot:"wep",atk:16,rarity:"rare",price:80},
  {name:"焚天剑",slot:"wep",atk:32,rarity:"legend",price:200},
  {name:"粗布道袍",slot:"armor",hp:25,def:0.04,rarity:"normal",price:25},
  {name:"灵纹法袍",slot:"armor",hp:60,def:0.09,rarity:"rare",price:70},
  {name:"混元道袍",slot:"armor",hp:120,def:0.16,rarity:"legend",price:180},
  {name:"灵玉坠",slot:"trinket",expRate:0.12,rarity:"normal",price:20},
  {name:"聚灵珠",slot:"trinket",expRate:0.25,rarity:"rare",price:90},
  {name:"鸿蒙玉佩",slot:"trinket",expRate:0.4,atk:12,rarity:"legend",price:220},
];
const artifactPool = [
  {name:"诛仙剑",slot:"wep",atk:80,rarity:"artifact",desc:"神器：万剑齐发，伤害大幅提升",price:999},
  {name:"不灭道衣",slot:"armor",hp:300,def:0.25,rarity:"artifact",desc:"神器：受到伤害减免",price:999},
  {name:"轮回灵环",slot:"trinket",expRate:0.8,atk:30,rarity:"artifact",desc:"神器：修炼速度暴涨",price:999},
];
const danPool = [
  {name:"回灵丹",type:"heal",val:60,price:12},
  {name:"爆炎丹",type:"buffAtk",val:0.4,dur:300,price:22},
  {name:"玄盾丹",type:"shield",val:80,price:18},
];
let shopGoods = [];
const monsterDef = [
  {name:"妖狼",color:"#a45",scale:1,hpMod:1,isBoss:false},
  {name:"穷奇",color:"#f62",scale:1.4,hpMod:2.2,isBoss:true,bulletType:"fire"},
  {name:"饕餮",color:"#932",scale:1.6,hpMod:2.8,isBoss:true,bulletType:"poison"},
];

function newPlayer(){
  return {
    x:canvas.width/2, y:canvas.height*0.35,
    hp:100, maxHp:100,
    exp:0, expNeed:100,
    coin:0,
    jing:0,
    atk:18, def:0,
    cd1:0, cd2:0, cd3:0,
    mods:[],
    bulletCount:1,
    expRate:1,
    shield:0,
    buffAtk:0, buffAtkTime:0,
    equip:{wep:null,armor:null,trinket:null},
    bag:[],
    dan:{heal:3, buffAtk:0, shield:0}
  }
}
let save = JSON.parse(localStorage.getItem("xuanhuangSave"))||null;
let p = save ? save : newPlayer();

let monsters = [];
let bullets = [];
let bossBullets = [];
let effects = [];
let touch = null;
let wave = 1;
let bossSpawned = false;
let gameOver = false;
let merchantActive = false;

const hpFill = document.getElementById("hpFill");
const expFill = document.getElementById("expFill");
const jingjieEl = document.getElementById("jingjie");
const coinEl = document.getElementById("coin");
const selectPanel = document.getElementById("selectPanel");
const optsEl = document.getElementById("opts");
const panelTitle = document.getElementById("panelTitle");
const sk1 = document.getElementById("skill1");
const sk2 = document.getElementById("skill2");
const sk3 = document.getElementById("skill3");
const cheatPanel = document.getElementById("cheatPanel");
const cheatOpen = document.getElementById("cheatOpen");
const bagPanel = document.getElementById("bagPanel");
const bagOpen = document.getElementById("bagOpen");
const bagGrid = document.getElementById("bagGrid");
const itemDesc = document.getElementById("itemDesc");
const useDanBtn = document.getElementById("useDan");
const shopPanel = document.getElementById("shopPanel");
const shopOpen = document.getElementById("shopOpen");
const shopList = document.getElementById("shopList");

cheatOpen.onclick = ()=>{
  cheatPanel.style.display = "block";
  document.getElementById("cHp").value = Math.floor(p.hp);
  document.getElementById("cMaxHp").value = Math.floor(p.maxHp);
  document.getElementById("cExp").value = Math.floor(p.exp);
  document.getElementById("cJing").value = p.jing;
  document.getElementById("cCoin").value = Math.floor(p.coin);
}
bagOpen.onclick = ()=>{
  bagPanel.style.display = "block";
  renderBag();
}
shopOpen.onclick = ()=>{
  shopPanel.style.display = "block";
  renderShop();
}

function saveGame(){
  localStorage.setItem("xuanhuangSave",JSON.stringify(p));
}

function applyCheat(){
  p.hp = Number(document.getElementById("cHp").value)||p.hp;
  p.maxHp = Number(document.getElementById("cMaxHp").value)||p.maxHp;
  p.exp = Number(document.getElementById("cExp").value)||p.exp;
  p.jing = Math.min(8,Math.max(0,Number(document.getElementById("cJing").value)||p.jing));
  p.coin = Number(document.getElementById("cCoin").value)||p.coin;
  p.expNeed = Math.floor(100 * Math.pow(1.5, p.jing));
  saveGame();
}
function giveRandomEquip(){
  let eq = {...equipPool[Math.floor(Math.random()*equipPool.length)]};
  p.bag.push(eq);
  saveGame(); alert("获得装备："+eq.name);
}
function giveArtifact(){
  let art = {...artifactPool[Math.floor(Math.random()*artifactPool.length)]};
  p.bag.push(art);
  saveGame(); alert("获得神器："+art.name);
}
function giveAllDan(){
  p.dan.heal +=5;
  p.dan.buffAtk +=3;
  p.dan.shield +=3;
  saveGame(); alert("丹药补满！");
}

function refreshShop(){
  shopGoods = [];
  for(let i=0;i<3;i++) shopGoods.push({...equipPool[Math.floor(Math.random()*equipPool.length)]});
  for(let i=0;i<2;i++) shopGoods.push({...danPool[Math.floor(Math.random()*danPool.length)]});
}
function renderShop(){
  shopList.innerHTML = "";
  shopGoods.forEach((gd,idx)=>{
    let div = document.createElement("div");
    div.className = "shopItem";
    div.innerHTML = `<div>${gd.name}</div><div class="tip">${gd.desc||""}</div><div>灵石：${gd.price}</div>`;
    let buyBtn = document.createElement("button");
    buyBtn.className = "buyBtn";
    buyBtn.innerText = "购买";
    buyBtn.onclick = ()=>{
      if(p.coin >= gd.price){
        p.coin -= gd.price;
        if(gd.slot){
          p.bag.push(gd);
        }else if(gd.type === "heal"){
          p.dan.heal++;
        }else if(gd.type === "buffAtk"){
          p.dan.buffAtk++;
        }else if(gd.type === "shield"){
          p.dan.shield++;
        }
        shopGoods.splice(idx,1);
        saveGame(); renderShop();
      }else alert("灵石不足！");
    }
    div.appendChild(buyBtn);
    shopList.appendChild(div);
  })
}

function renderBag(){
  bagGrid.innerHTML = "";
  document.getElementById("slotWep").innerText = p.equip.wep?.name||"武器";
  document.getElementById("slotArmor").innerText = p.equip.armor?.name||"法袍";
  document.getElementById("slotTrinket").innerText = p.equip.trinket?.name||"饰品";
  p.bag.forEach((it,idx)=>{
    let div = document.createElement("div");
    div.className = "item "+it.rarity;
    div.innerText = it.name.slice(0,4);
    div.onclick = ()=>{
      itemDesc.innerText = it.desc||"";
      if(confirm("穿戴 "+it.name+" ?")){
        p.equip[it.slot] = it;
        recalcEquipBonus();
        p.bag.splice(idx,1);
        saveGame(); renderBag();
      }
    }
    bagGrid.appendChild(div);
  })
}
function recalcEquipBonus(){
  let base = newPlayer();
  let e = p.equip;
  p.atk = base.atk;
  p.maxHp = base.maxHp;
  p.def = base.def;
  p.expRate = base.expRate;
  if(e.wep) p.atk += e.wep.atk||0;
  if(e.armor){ p.maxHp += e.armor.hp||0; p.def += e.armor.def||0; }
  if(e.trinket){ p.expRate += e.trinket.expRate||0; p.atk += e.trinket.atk||0; }
  p.hp = Math.min(p.hp, p.maxHp);
}

useDanBtn.onclick = ()=>{
  if(p.dan.heal>0){
    p.dan.heal--;
    p.hp = Math.min(p.maxHp, p.hp + 60);
  }else if(p.dan.shield>0){
    p.dan.shield--;
    p.shield +=80;
  }else if(p.dan.buffAtk>0){
    p.dan.buffAtk--;
    p.buffAtk +=0.4;
    p.buffAtkTime = 300;
  }else alert("没有丹药了！");
  saveGame();
}

function showSelect(title, extraTip=""){
  panelTitle.innerText = title;
  selectPanel.style.display = "flex";
  optsEl.innerHTML = "";
  let pick = [];
  while(pick.length<3){
    let r = modPool[Math.floor(Math.random()*modPool.length)];
    if(!pick.includes(r)) pick.push(r);
  }
  pick.forEach(m=>{
    let b = document.createElement("button");
    b.className = "opt";
    b.innerText = `${m.name}\n${m.desc}`;
    b.onclick = ()=>{
      applyMod(m);
      selectPanel.style.display = "none";
      saveGame();
    }
    optsEl.appendChild(b);
  })
  selectPanel.querySelector(".tip").innerText = extraTip;
}
function applyMod(m){
  p.mods.push(m);
  switch(m.type){
    case "atk": p.atk *= (1+m.v); break;
    case "hp": p.maxHp *= (1+m.v); p.hp = Math.min(p.hp* (1+m.v), p.maxHp); break;
    case "cd1": p.cd1 -= m.v; break;
    case "cd3": p.cd3 -= m.v; break;
    case "exp": p.expRate *= (1+m.v); break;
    case "bullet": p.bulletCount += m.v; break;
    case "def": p.def += m.v; break;
  }
}

function spawnMonster(isBoss=false){
  let defIdx = isBoss ? (Math.random()>0.5?1:2) : 0;
  let md = monsterDef[defIdx];
  let baseHp = (30 + wave*18) * md.hpMod;
  let sz = isBoss ? 64*md.scale : 32*md.scale;
  let m = {
    x: Math.random()*(canvas.width-sz)+sz/2,
    y: -sz,
    w: sz, h:sz,
    hp: isBoss?baseHp*6:baseHp,
    maxHp: isBoss?baseHp*6:baseHp,
    spd: isBoss?1.1:1.4+wave*0.04,
    dmg: isBoss?14:6,
    color: md.color,
    name: md.name,
    isBoss,
    bulletTimer:0,
    bulletType: md.bulletType||null
  }
  monsters.push(m);
}

function fire1(){
  let cd = 60*(1-Math.max(0,p.cd1));
  if(p.cd1>0) return;
  p.cd1 = cd;
  let dmg = p.atk * (1+p.buffAtk);
  for(let i=0;i<p.bulletCount;i++){
    let ang = Math.PI*0.4*(i-(p.bulletCount-1)/2);
    bullets.push({x:p.x,y:p.y, vx:Math.sin(ang)*7,vy:-Math.cos(ang)*7, dmg:dmg});
  }
}
function fire2(){
  if(p.cd2>0) return;
  p.cd2 = 140;
  let dmg = p.atk*2.2 * (1+p.buffAtk);
  effects.push({x:p.x,y:p.y,r:10,maxR:110, t:0,type:"thunder",dmg:dmg,hitSet:new Set()});
}
function fire3(){
  if(p.cd3>0) return;
  p.cd3 = 100*(1-Math.max(0,p.cd3));
  p.y -= 80;
  effects.push({x:p.x,y:p.y,r:18,maxR:18,t:0,type:"dash"});
}
sk1.onclick = fire1; sk2.onclick = fire2; sk3.onclick = fire3;

canvas.addEventListener("touchstart",e=>{e.preventDefault(); touch = {x:e.touches[0].clientX, y:e.touches[0].clientY};})
canvas.addEventListener("touchmove",e=>{e.preventDefault(); touch = {x:e.touches[0].clientX, y:e.touches[0].clientY};})
canvas.addEventListener("touchend",()=>touch=null);

function coll(a,b){
  return a.x < b.x+b.w && a.x+16 > b.x && a.y < b.y+b.h && a.y+16 > b.y;
}
function collPoint(px,py,r,rect){
  let cx = Math.max(rect.x, Math.min(px, rect.x+rect.w));
  let cy = Math.max(rect.y, Math.min(py, rect.y+rect.h));
  return Math.hypot(px-cx, py-cy) < r;
}

function loop(){
  requestAnimationFrame(loop);
  if(gameOver){
    ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#f44";ctx.font="24px sans-serif";ctx.textAlign="center";
    ctx.fillText("道陨，秘境倾覆",canvas.width/2,canvas.height/2-30);
    ctx.fillText("点击重置秘境",canvas.width/2,canvas.height/2+10);
    canvas.onclick=()=>{
      p=newPlayer(); monsters=[];bullets=[];bossBullets=[];effects=[];wave=1;bossSpawned=false;merchantActive=false;gameOver=false;saveGame();
    }
    return;
  }

  if(p.buffAtkTime>0){
    p.buffAtkTime--;
  }else{
    p.buffAtk = 0;
  }

  if(touch){
    let dx = touch.x - p.x;
    let dy = touch.y - p.y;
    p.x += dx*0.08;
    p.y += dy*0.08;
  }
  p.x = Math.max(16,Math.min(canvas.width-16,p.x));
  p.y = Math.max(16,Math.min(canvas.height-120,p.y));

  p.cd1 = Math.max(0,p.cd1-1);
  p.cd2 = Math.max(0,p.cd2-1);
  p.cd3 = Math.max(0,p.cd3-1);

  if(monsters.length < 4+wave && Math.random()<0.025) spawnMonster();
  if(!bossSpawned && wave%3===0 && monsters.length===0){
    spawnMonster(true); bossSpawned=true;
  }
  if(!merchantActive && bossSpawned===false && Math.random()<0.25){
    merchantActive = true;
    refreshShop();
    shopOpen.style.display = "block";
  }

  monsters.forEach((m,mi)=>{
    let dx = p.x - m.x;
    let dy = p.y - m.y;
    let d = Math.hypot(dx,dy);
    m.x += dx/d*m.spd;
    m.y += dy/d*m.spd;
    if(m.isBoss && m.bulletType){
      m.bulletTimer++;
      if(m.bulletTimer > 70){
        m.bulletTimer = 0;
        let angBase = Math.atan2(p.y - m.y, p.x - m.x);
        for(let i=-2;i<=2;i++){
          let ang = angBase + i*0.22;
          bossBullets.push({
            x:m.x+m.w/2, y:m.y+m.h/2,
            vx:Math.cos(ang)*3.2, vy:Math.sin(ang)*3.2,
            dmg:8,
            type:m.bulletType
          })
        }
      }
    }
    if(coll({x:p.x,y:p.y,w:16,h:16},m)){
      let rawDmg = m.dmg*(1-p.def);
      if(p.shield>0){
        let sd = Math.min(p.shield, rawDmg);
        p.shield -= sd;
        rawDmg -= sd;
      }
      p.hp -= rawDmg;
      m.hp -= p.atk*0.4;
    }
  })

  bullets.forEach((b,bi)=>{
    b.x += b.vx; b.y += b.vy;
    monsters.forEach((m,mi)=>{
      if(coll(b,m)){
        m.hp -= b.dmg;
        bullets.splice(bi,1);
      }
    })
  })

  for(let i=bossBullets.length-1;i>=0;i--){
    let bb = bossBullets[i];
    bb.x += bb.vx;
    bb.y += bb.vy;
    if(bb.x<0||bb.x>canvas.width||bb.y<0||bb.y>canvas.height){
      bossBullets.splice(i,1);continue;
    }
    if(collPoint(bb.x,bb.y,7,{x:p.x-8,y:p.y-8,w:16,h:16})){
      let rawDmg = bb.dmg*(1-p.def);
      if(p.shield>0){
        let sd = Math.min(p.shield, rawDmg);
        p.shield -= sd;
        rawDmg -= sd;
      }
      p.hp -= rawDmg;
      bossBullets.splice(i,1);
    }
  }

  effects.forEach((ef,ei)=>{
    ef.t++;
    if(ef.type==="thunder"){
      ef.r += 6;
      monsters.forEach(m=>{
        let d = Math.hypot(m.x-ef.x, m.y-ef.y);
        if(d < ef.r && !ef.hitSet.has(m)) {
          m.hp -= ef.dmg;
          ef.hitSet.add(m);
        }
      })
      if(ef.r>ef.maxR) effects.splice(ei,1);
    }else if(ef.type==="dash"){
      if(ef.t>12) effects.splice(ei,1);
    }
  })

  for(let i=monsters.length-1;i>=0;i--){
    let m = monsters[i];
    if(m.hp<=0){
      let expGain = (m.isBoss?60:12)*p.expRate;
      let coinGain = m.isBoss?30:4;
      p.exp += expGain;
      p.coin += coinGain;
      monsters.splice(i,1);
      if(m.isBoss){
        wave++; bossSpawned=false;
        showSelect("BOSS陨落 · 逆天改命","穷奇烈焰、饕餮毒雾凶险万分！");
      }
      if(p.exp >= p.expNeed){
        p.exp -= p.expNeed;
        p.jing = Math.min(p.jing+1, jings.length-1);
        p.expNeed = Math.floor(p.expNeed*1.5);
        showSelect("渡劫成功，境界晋升！","修为蜕变，道基加固");
      }
    }
  }

  if(p.hp<=0){gameOver=true;}

  ctx.fillStyle="#11141a";ctx.fillRect(0,0,canvas.width,canvas.height);
  if(p.shield>0){
    ctx.strokeStyle="#4cf"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(p.x,p.y,22,0,Math.PI*2);ctx.stroke();
  }
  ctx.fillStyle=p.buffAtk>0?"#f84":"#4cf";
  ctx.beginPath();ctx.arc(p.x,p.y,14,0,Math.PI*2);ctx.fill();
  monsters.forEach(m=>{
    ctx.fillStyle=m.color;
    ctx.fillRect(m.x,m.y,m.w,m.h);
    ctx.fillStyle="#333";ctx.fillRect(m.x,m.y-6,m.w,4);
    ctx.fillStyle="#f44";ctx.fillRect(m.x,m.y-6,m.w*(m.hp/m.maxHp),4);
  })
  ctx.fillStyle="#8df";
  bullets.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fill();})
  bossBullets.forEach(bb=>{
    if(bb.type==="fire") ctx.fillStyle="#f73";
    else ctx.fillStyle="#7b3";
    ctx.beginPath();ctx.arc(bb.x,bb.y,7,0,Math.PI*2);ctx.fill();
  })
  effects.forEach(ef=>{
    if(ef.type==="thunder"){
      ctx.strokeStyle=`rgba(180,220,255,${1-ef.r/ef.maxR})`;
      ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(ef.x,ef.y,ef.r,0,Math.PI*2);ctx.stroke();
    }else if(ef.type==="dash"){
      ctx.fillStyle="rgba(120,200,255,0.5)";
      ctx.beginPath();ctx.arc(ef.x,ef.y,ef.r,0,Math.PI*2);ctx.fill();
    }
  })

  hpFill.style.width = `${Math.max(0,(p.hp/p.maxHp)*100)}%`;
  expFill.style.width = `${(p.exp/p.expNeed)*100}%`;
  jingjieEl.innerText = jings[p.jing];
  coinEl.innerText = Math.floor(p.coin);
  sk1.disabled = p.cd1>0;
  sk2.disabled = p.cd2>0;
  sk3.disabled = p.cd3>0;
}
loop();
</script>
</body>
</html>
